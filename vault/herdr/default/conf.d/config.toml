# herdr configuration
# Place this file at ~/.config/herdr/config.toml
# View the full default with: herdr --default-config
# Reference: https://herdr.dev/docs/configuration/
#
# Every value is written explicitly, even when it matches the herdr default.
# Intentional deviations from the default: keys.prefix, the [experimental]
# CJK IME settings, and the custom tokens in ui.sidebar.spaces.rows;
# everything else mirrors the shipped defaults.

# Show first-run notification setup on startup.
# Reference: https://herdr.dev/docs/configuration/#config-file
onboarding = false

[theme]
# Reference: https://herdr.dev/docs/configuration/#theme
# Built-in themes: catppuccin, terminal, tokyo-night, dracula, nord,
#                  gruvbox, one-dark, solarized, kanagawa, rose-pine, vesper
name = "catppuccin"
# Follow the host terminal light/dark appearance and switch themes.
auto_switch = false
dark_name = "catppuccin"
light_name = "catppuccin-latte"
# [theme.custom] overrides individual color tokens on top of the base theme.
# Left unset (no default overrides).

[terminal]
# Reference: https://herdr.dev/docs/configuration/#terminal-defaults
# Executable for new interactive panes. Empty means $SHELL, then /bin/sh.
default_shell = ""
# Startup mode for new interactive pane shells: "auto", "login", or "non_login".
shell_mode = "auto"
# CWD policy for new panes/tabs/workspaces: "follow", "home", "current", or a fixed path.
new_cwd = "follow"

[update]
# Reference: https://herdr.dev/docs/configuration/#updates
# Update channel: "stable" or "preview".
channel = "stable"
# Check herdr.dev for new versions in the background.
version_check = true
# Check herdr.dev for remote agent-detection manifest updates in the background.
manifest_check = true

[keys]
# Reference: https://herdr.dev/docs/configuration/#keybindings
# Guidance:  https://herdr.dev/docs/keyboard/
prefix = "ctrl+t"

# Prefix-mode actions
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+shift+r"
open_notification_target = ""
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = ["prefix+shift+n", "alt+n"]
new_worktree = "prefix+shift+g"
open_worktree = ""
remove_worktree = ""
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = ["prefix+ctrl+p"]
next_workspace = ["prefix+ctrl+n"]
previous_agent = ["prefix+,", "alt+["]
next_agent = ["prefix+.", "alt+]"]
focus_agent = ""
remote_image_paste = "ctrl+v"
new_tab = ["prefix+c", "alt+t"]
rename_tab = "prefix+shift+t"
previous_tab = ["alt+shift+["]
next_tab = ["alt+shift+]"]
switch_tab = "prefix+1..9"
switch_workspace = ""
close_tab = "prefix+shift+x"
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"
focus_pane_left = ["prefix+h", "alt+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+l", "alt+right"]
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+o"
split_vertical = ["prefix+v", "alt+d"]
split_horizontal = ["prefix+minus", "alt+shift+d"]
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"

# Navigate-mode movement. These local shortcuts win while navigate mode is open.
# They are independent from focus_pane_*. Do not include prefix+, esc, enter, tab, or 1..9 here.
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# Legacy indexed shortcuts. Empty (off) by default; prefer switch_tab/switch_workspace/focus_agent.
[keys.indexed]
tabs = ""
workspaces = ""
agents = ""

[[keys.command]]
key = ["prefix+space"]
type = "popup"
command = "cd \"$(herdr-pwd)\"; exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "98%"
height = "98%"

[[keys.command]]
key = ["prefix+ctrl+g"]
type = "popup"
command = "cd \"$(herdr-pwd)\"; exec tig"
description = "open tig"
width = "98%"
height = "98%"

[worktrees]
# Reference: https://herdr.dev/docs/configuration/#worktrees
directory = "~/.herdr/worktrees"

[ui]
# Reference: https://herdr.dev/docs/configuration/#ui-and-sidebar
sidebar_width = 64
sidebar_min_width = 18
sidebar_max_width = 96
mobile_width_threshold = 64
mouse_capture = true
right_click_passthrough_modifier = ""
redraw_on_focus_gained = true
mouse_scroll_lines = 3
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
# Agent panel ordering: "spaces" or "priority".
agent_panel_sort = "spaces"
# Accent color: hex (#89b4fa), named colors (cyan, blue, magenta), or rgb(r,g,b).
accent = "cyan"

[ui.sidebar.spaces]
# Reference: https://herdr.dev/docs/configuration/#ui-and-sidebar
# $tabs (the tab labels joined by " / ", indented under a leading emoji in the
# workspace name) is reported by the plugin in plugins/workspace-meta.
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["$tabs"],
]

[ui.toast]
# Reference: https://herdr.dev/docs/configuration/#notifications
# Delivery: "off", "herdr", "terminal", or "system".
delivery = "terminal"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
# Reference: https://herdr.dev/docs/configuration/#sound
enabled = true
# path/done_path/request_path override sounds with custom mp3 files (unset by default).

[ui.sound.agents]
# Per-agent overrides: "default" | "on" | "off". droid is muted by default.
droid = "off"

[session]
# Reference: https://herdr.dev/docs/configuration/#agent-session-restore
# Details:   https://herdr.dev/docs/session-state/
# Resume supported AI-agent panes into their native sessions after a server restart.
resume_agents_on_restore = true

[remote]
# Reference: https://herdr.dev/docs/configuration/#remote-attach
# Whether herdr manages the ssh config used for the `herdr --remote` bridge.
manage_ssh_config = true

[experimental]
# Allow launching herdr from inside a herdr-managed pane.
# Reference: https://herdr.dev/docs/configuration/#nested-launches
allow_nested = false
# Experimental local Kitty graphics rendering for attached clients.
# Reference: https://herdr.dev/docs/configuration/#kitty-graphics
kitty_graphics = false
# Save recent pane screen history across full server restarts.
# Reference: https://herdr.dev/docs/configuration/#pane-screen-history
pane_history = false
# --- CJK IME settings for running AI agents inside panes (macOS, experimental). ---
# While prefix mode is active, temporarily switch to an ASCII keyboard so prefix commands register.
# Reference: https://herdr.dev/docs/configuration/#prefix-input-source-switching
switch_ascii_input_source_in_prefix = true
# Expose the cursor to the outer terminal even when a TUI draws its own, so the IME candidate window keeps tracking.
# Reference: https://herdr.dev/docs/configuration/#ime-cursor-tracking
reveal_hidden_cursor_for_cjk_ime = true
# Limit the cursor exposure above to AI-agent panes.
# An empty list applies it to every pane, showing a stray cursor in e.g. vim normal mode.
cjk_ime_agents = ["claude", "codex", "pi", "gemini"]
# Cursor shape when reveal_hidden_cursor_for_cjk_ime is true.
# Values: block, steady_block, underline, steady_underline, bar, steady_bar.
cjk_ime_cursor_shape = "steady_block"

[advanced]
# Reference: https://herdr.dev/docs/configuration/#scrollback
# Maximum scrollback buffer size in bytes retained per pane terminal.
scrollback_limit_bytes = 10000000
